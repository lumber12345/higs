# Render Blueprint — deploy this repo as a web service on Render.
# Docs: https://render.com/docs/blueprint-spec
#
# Option A (recommended): connect this repo in the Render dashboard and
# choose "Blueprint" — Render reads this file automatically.
# Option B: create a Web Service manually with the same settings below.

services:
  - type: web
    name: higs-solver-api
    runtime: python
    # Use the Docker image instead of the native Python runtime by
    # switching `runtime` to `docker` and setting `dockerfilePath`.
    # The native runtime is faster to build; the Dockerfile is provided
    # for parity and for local testing.
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT (default 10000). Bind 0.0.0.0:$PORT.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional: set to "true" to see HiGHS solver logs in Render logs.
      # - key: HIGHS_LOG
      #   value: "false"
    # Free tier sleeps after inactivity; upgrade to a paid plan for
    # always-on. See https://render.com/docs/free
    plan: free
    # Uncomment to use the Dockerfile-based deploy instead:
    # runtime: docker
    # dockerfilePath: ./Dockerfile
